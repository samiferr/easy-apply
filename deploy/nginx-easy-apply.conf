# Template: deploy/deploy.sh fills in __DOMAIN__, __SERVER_NAMES__ and
# __GUNICORN_PORT__ from the DOMAIN / INCLUDE_WWW Actions secrets or variables.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    # Exempt ACME HTTP-01 challenges from the HTTPS redirect below so
    # `certbot renew` (webroot authenticator, see deploy.sh) keeps working.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAMES__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Resume uploads are capped at RESUME_MAX_UPLOAD_BYTES (8 MB by default).
    client_max_body_size 20M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/easy-apply/staticfiles/;
    }

    # Only avatars are public. Everything else under media/ (uploaded
    # resumes) is personal data and is never served directly.
    location /media/avatars/ {
        alias /var/www/easy-apply/media/avatars/;
    }

    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:__GUNICORN_PORT__;
        # AI requests are queued to Celery, so the web side stays fast; this
        # only covers slow uploads and PDF exports.
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the staff portal's audit trail trusts this
        # header (STAFF_PORTAL_TRUST_X_FORWARDED_FOR=True in deploy.sh).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
