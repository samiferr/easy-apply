  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="hero-bg-glow" x1="120" y1="60" x2="560" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.10" />

    <linearGradient id="card-grad-1" x1="0" y1="0" x2="220" y2="120" gradientUnits="userSpaceOnUse">

    <linearGradient id="brand-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />

    <linearGradient id="emerald-grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />

    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">

    <filter id="float-shadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">

    <circle cx="75" cy="40" r="4" fill="#ffffff" class="dark:fill-slate-950" />
  </g>

  <!-- Modern Lounge Chair / Beanbag (Ergonomic, laid back) -->

    <path d="M60 210C30 190 20 130 50 80C75 40 130 30 180 60C220 85 240 140 230 190C220 235 150 250 100 240C78 235 68 220 60 210Z"

          fill="#2563eb" opacity="0.25" class="dark:fill-brand-600 dark:opacity-30" />

  <!-- Relaxing Character (Kicking back, feet up, enjoying tea/coffee) -->

    <path d="M31 10V6" stroke="#475569" stroke-width="1.5" />

    <!-- Card Header -->
    <circle cx="22" cy="24" r="6" fill="#3b82f6" />
    <text x="36" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" class="dark:fill-white">13 Sections Extracted</text>

    <rect x="20" y="56" width="76" height="22" rx="11" fill="#eff6ff" class="dark:fill-brand-950" stroke="#3b82f6" stroke-width="1" />
    <text x="30" y="71" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8" class="dark:fill-brand-300">⚡ Instant</text>
    <rect x="104" y="56" width="82" height="22" rx="11" fill="#ecfdf5" class="dark:fill-emerald-950" stroke="#10b981" stroke-width="1" />
    <text x="114" y="71" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#047857" class="dark:fill-emerald-400">✓ 0 Typing</text>

    <rect width="205" height="100" rx="14" fill="#ffffff" class="dark:fill-slate-900" stroke="#e2e8f0" stroke-width="1.5" class="dark:stroke-slate-700" />
    <!-- Badge Icon -->
    <circle cx="26" cy="28" r="14" fill="#dcfce7" class="dark:fill-emerald-950" />
    <path d="M20 28L24.5 32.5L32 24" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="26" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#0f172a" class="dark:fill-white">Strong Match</text>
    <text x="48" y="41" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" class="dark:fill-slate-400">Requirements verified</text>
    <!-- Visual pill -->
    <g transform="translate(18, 56)">
      <rect x="0" y="0" width="168" height="28" rx="7" fill="#f8fafc" class="dark:fill-slate-800" stroke="#e2e8f0" stroke-width="1" class="dark:stroke-slate-700" />

      <circle cx="152" cy="14" r="5.5" fill="#10b981" />

    <rect width="215" height="90" rx="14" fill="#ffffff" class="dark:fill-slate-900" stroke="#e2e8f0" stroke-width="1.5" class="dark:stroke-slate-700" />
    <rect x="14" y="16" width="34" height="42" rx="6" fill="#eff6ff" class="dark:fill-brand-950" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M22 26H40M22 34H36M22 42H32" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />

    <text x="58" y="46" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#059669" class="dark:fill-emerald-400">✓ Ready to Export (PDF)</text>
    <rect x="58" y="56" width="142" height="22" rx="5" fill="#2563eb" />
    <text x="82" y="71" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">1-Click Download</text>

    <circle cx="380" cy="180" r="4" fill="#93c5fd" opacity="0.6" />
    <circle cx="430" cy="270" r="3.5" fill="#a7f3d0" opacity="0.8" />
  </g>
</svg>
