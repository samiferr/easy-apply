<svg viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto max-w-[200px] mx-auto select-none" aria-hidden="true">
  <!-- Soft background glow -->
  <circle cx="120" cy="90" r="75" fill="#3b82f6" fill-opacity="0.08" />

  <!-- Cloud / Drop Zone Target -->
  <rect x="35" y="45" width="170" height="110" rx="14" fill="#ffffff" class="dark:fill-slate-900" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4" class="dark:stroke-brand-800" />

  <!-- Scanning / Parsing Beam -->
  <path d="M40 90H200" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <rect x="40" y="80" width="160" height="20" fill="url(#drop-beam-grad)" opacity="0.25" />
  <defs>
    <linearGradient id="drop-beam-grad" x1="120" y1="80" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Floating Resume Document -->
  <g transform="translate(85, 20)">
    <rect x="0" y="0" width="70" height="92" rx="6" fill="#ffffff" class="dark:fill-slate-800" stroke="#3b82f6" stroke-width="2" />
    <!-- Header avatar & name placeholder -->
    <circle cx="16" cy="16" r="6" fill="#3b82f6" />
    <rect x="28" y="12" width="30" height="4" rx="2" fill="#1e293b" class="dark:fill-slate-200" />
    <rect x="28" y="19" width="20" height="3" rx="1.5" fill="#64748b" class="dark:fill-slate-400" />
    <!-- Content lines -->
    <rect x="10" y="32" width="50" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="10" y="40" width="44" height="3" rx="1.5" fill="#cbd5e1" class="dark:fill-slate-600" />
    <rect x="10" y="48" width="48" height="3" rx="1.5" fill="#cbd5e1" class="dark:fill-slate-600" />
    <rect x="10" y="56" width="38" height="3" rx="1.5" fill="#cbd5e1" class="dark:fill-slate-600" />
    <!-- PDF badge -->
    <rect x="36" y="70" width="26" height="14" rx="3" fill="#ef4444" />
    <text x="40" y="80" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#ffffff">PDF</text>
  </g>

  <!-- Extracted Skill Tags popping out effortlessly -->
  <g transform="translate(42, 118)">
    <rect width="45" height="18" rx="9" fill="#eff6ff" class="dark:fill-brand-950" stroke="#3b82f6" stroke-width="1" />
    <text x="7" y="12" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#2563eb" class="dark:fill-brand-300">Python</text>
  </g>
  <g transform="translate(95, 118)">
    <rect width="48" height="18" rx="9" fill="#ecfdf5" class="dark:fill-emerald-950" stroke="#10b981" stroke-width="1" />
    <text x="7" y="12" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#059669" class="dark:fill-emerald-400">English C2</text>
  </g>
  <g transform="translate(150, 118)">
    <rect width="46" height="18" rx="9" fill="#fef3c7" class="dark:fill-amber-950" stroke="#f59e0b" stroke-width="1" />
    <text x="7" y="12" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#d97706" class="dark:fill-amber-400">5+ yrs exp</text>
  </g>
</svg>
