<svg viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-auto max-w-[280px] mx-auto select-none" aria-hidden="true">
  <!-- Glowing neural aura -->
  <defs>
    <radialGradient id="brain-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="battery-full" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <circle cx="160" cy="100" r="95" fill="url(#brain-glow)" />

  <!-- Brain Outline / Stylized Vector Lobes -->
  <g transform="translate(70, 30)">
    <!-- Left hemisphere -->
    <path d="M70 110C60 110 50 105 45 95C35 95 28 85 30 75C22 70 20 58 25 50C20 40 25 28 35 22C45 15 60 18 68 25C74 18 85 20 90 28"
          stroke="#3b82f6" stroke-width="3" stroke-linecap="round" fill="#eff6ff" class="" />
    <!-- Right hemisphere -->
    <path d="M110 110C120 110 130 105 135 95C145 95 152 85 150 75C158 70 160 58 155 50C160 40 155 28 145 22C135 15 120 18 112 25C106 18 95 20 90 28"
          stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" fill="#f5f3ff" class="" />

    <!-- Center fissure -->
    <path d="M90 28V112" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round" />

    <!-- Internal gyri / cerebral folds -->
    <path d="M48 45Q62 38 68 52Q72 65 58 70" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none" class="" />
    <path d="M42 75Q52 85 65 80" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none" class="" />

    <path d="M132 45Q118 38 112 52Q108 65 122 70" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" fill="none" class="dark:stroke-purple-900" />
    <path d="M138 75Q128 85 115 80" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" fill="none" class="dark:stroke-purple-900" />

    <!-- Energy spark points (Neural synapses firing smoothly) -->
    <circle cx="50" cy="35" r="3" fill="#3b82f6" />
    <circle cx="130" cy="35" r="3" fill="#8b5cf6" />
    <circle cx="68" cy="95" r="3" fill="#10b981" />
    <circle cx="112" cy="95" r="3" fill="#10b981" />
  </g>

  <!-- High Cognitive Battery Pill below -->
  <g transform="translate(60, 160)">
    <!-- Battery case -->
    <rect x="30" y="8" width="130" height="32" rx="16" fill="#ffffff" class="" stroke="#10b981" stroke-width="2" />
    <rect x="162" y="18" width="6" height="12" rx="3" fill="#10b981" />
    <!-- Charged bars (95% full) -->
    <rect x="36" y="14" width="112" height="20" rx="10" fill="url(#battery-full)" />
    <!-- Label inside battery -->
    <text x="52" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">95% BRAIN ENERGY</text>
  </g>
</svg>
