{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as AVAILABLE_LANGUAGES %}
<form action="{% url 'set_language' %}" method="post" class="flex items-center rounded-lg bg-on-surface/5 p-0.5">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}" />
  {% for code, name in AVAILABLE_LANGUAGES %}
    <button type="submit" name="language" value="{{ code }}"
      class="rounded-md px-2 py-1 text-xs font-semibold uppercase transition
        {% if code == CURRENT_LANGUAGE %}bg-surface-container-low text-primary shadow-sm
        {% else %}text-on-surface-variant hover:text-on-surface{% endif %}"
      {% if code == CURRENT_LANGUAGE %}aria-current="true"{% endif %}
      lang="{{ code }}" title="{{ name }}">{{ code }}</button>
  {% endfor %}
</form>
