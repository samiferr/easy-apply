{% load i18n %}
{% if messages %}
  <div class="space-y-3">
    {% for message in messages %}
      <div
        x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 6000)" x-transition
        class="flex items-start justify-between gap-3 rounded-xl border px-4 py-3 text-sm shadow-sm
          {% if message.tags == 'success' %} border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950/50 dark:text-emerald-300
          {% elif message.tags == 'error' %} border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-900 dark:bg-rose-950/50 dark:text-rose-300
          {% elif message.tags == 'warning' %} border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950/50 dark:text-amber-300
          {% else %} border-sky-200 bg-sky-50 text-sky-800 dark:border-sky-900 dark:bg-sky-950/50 dark:text-sky-300 {% endif %}"
        role="status">
        <span>{{ message }}</span>
        <button type="button" @click="show = false" class="shrink-0 opacity-60 transition hover:opacity-100" aria-label="{% trans 'Dismiss' %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
