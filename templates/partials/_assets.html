{% load static %}<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'dist/output.css' %}" />
<script>
  // Theme before first paint, so a dark-mode reader never sees a white flash.
  // Storage can be blocked (private windows, strict settings): fall back to
  // the system preference.
  (function () {
    var stored = null;
    try { stored = localStorage.getItem("theme"); } catch (e) {}
    if (stored === "dark" || (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  })();
  function toggleThemePreference() {
    var dark = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
    return dark;
  }
</script>
