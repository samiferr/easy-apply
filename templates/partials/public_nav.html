{% load i18n lumen %}
<header class="sticky top-0 z-40 border-b border-border-subtle bg-background-base">
  <nav class="mx-auto flex max-w-5xl items-center justify-between gap-spacing-200 px-4 py-spacing-200 sm:px-6 lg:px-8" aria-label="{% trans 'Main navigation' %}">
    <a href="{% url 'core:home' %}" class="flex items-center gap-spacing-200 rounded-corner-radius-500 text-title-l text-content-heading">
      {% include "partials/_brand_mark.html" %}
      {{ SITE_NAME }}
    </a>

    <div class="flex items-center gap-spacing-100">
      <span class="hidden sm:block">{% include "partials/language_switcher.html" %}</span>
      <button type="button" @click="toggleTheme()" class="btn-icon" aria-label="{% trans 'Toggle dark mode' %}">
        {% icon "moon" class="dark:hidden" %}{% icon "sun" class="hidden dark:block" %}
      </button>
      {% if user.is_authenticated %}
        <a href="{% url 'core:dashboard' %}" class="btn-primary btn-sm">{% trans "Go to dashboard" %}</a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn-ghost btn-sm">{% trans "Log in" %}</a>
        <a href="{% url 'accounts:register' %}" class="btn-primary btn-sm hidden sm:inline-flex">{% trans "Create account" %}</a>
      {% endif %}
    </div>
  </nav>
</header>
