{% load i18n %}
<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-950/80">
  <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">
    <a href="{% url 'core:home' %}" class="flex items-center gap-2 text-lg font-extrabold tracking-tight text-slate-900 dark:text-white">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-600 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4" /><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" /></svg>
      </span>
      {{ SITE_NAME }}
    </a>

    <div class="flex items-center gap-2">
      {% include "partials/language_switcher.html" %}
      <button type="button" @click="toggleTheme()" class="rounded-lg p-2 text-slate-500 transition hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800" aria-label="{% trans 'Toggle dark mode' %}">
        <svg xmlns="http://www.w3.org/2000/svg" class="hidden h-5 w-5 dark:block" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>
        <svg xmlns="http://www.w3.org/2000/svg" class="block h-5 w-5 dark:hidden" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" /></svg>
      </button>
      {% if user.is_authenticated %}
        <a href="{% url 'core:dashboard' %}" class="btn-primary">{% trans "Go to dashboard" %}</a>
      {% else %}
        <a href="{% url 'accounts:login' %}" class="btn-ghost">{% trans "Log in" %}</a>
        <a href="{% url 'accounts:register' %}" class="btn-primary">{% trans "Create account" %}</a>
      {% endif %}
    </div>
  </nav>
</header>
