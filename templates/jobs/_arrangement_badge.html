{% load i18n %}
{% if arrangement == "remote" %}
  <span class="badge bg-secondary-container text-on-secondary-container">{% trans "Remote" %}</span>
{% elif arrangement == "hybrid" %}
  <span class="badge bg-tertiary-container text-on-tertiary-container">{% trans "Hybrid" %}</span>
{% elif arrangement == "onsite" %}
  <span class="badge bg-surface-container-high text-on-surface-variant">{% trans "On-site" %}</span>
{% else %}
  <span class="badge bg-surface-container-highest text-on-surface-variant">{% trans "Arrangement not specified" %}</span>
{% endif %}
