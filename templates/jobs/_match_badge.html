{% if status == "strong" %}
  <span class="badge shrink-0 bg-emerald-100 text-emerald-700 dark:bg-emerald-900 dark:text-emerald-300">
    <svg xmlns="http://www.w3.org/2000/svg" class="mr-1 h-3 w-3" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" clip-rule="evenodd" /></svg>
    Strong match
  </span>
{% elif status == "partial" %}
  <span class="badge shrink-0 bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300">Partial match</span>
{% elif status == "none" %}
  <span class="badge shrink-0 bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">Not covered</span>
{% endif %}
