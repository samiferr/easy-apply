{% if category_type == "required" %}
  <span class="badge bg-rose-100 text-rose-700 dark:bg-rose-900 dark:text-rose-300">Must-have</span>
{% elif category_type == "preferred" %}
  <span class="badge bg-sky-100 text-sky-700 dark:bg-sky-900 dark:text-sky-300">Nice-to-have</span>
{% elif category_type == "responsibilities" %}
  <span class="badge bg-brand-100 text-brand-700 dark:bg-brand-900 dark:text-brand-300">What you'll do</span>
{% else %}
  <span class="badge bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">Other</span>
{% endif %}
