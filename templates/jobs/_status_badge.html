{% load i18n %}
{% if status == "completed" %}
  <span class="badge shrink-0 bg-emerald-100 text-emerald-700 dark:bg-emerald-900 dark:text-emerald-300">{% trans "Completed" %}</span>
{% elif status == "failed" %}
  <span class="badge shrink-0 bg-rose-100 text-rose-700 dark:bg-rose-900 dark:text-rose-300">{% trans "Failed" %}</span>
{% elif status == "processing" %}
  <span class="badge shrink-0 bg-amber-100 text-amber-700 dark:bg-amber-900 dark:text-amber-300">{% trans "Analyzing…" %}</span>
{% else %}
  <span class="badge shrink-0 bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">{% trans "Pending" %}</span>
{% endif %}
