{% load i18n %}
{% if status == "completed" %}
  <span class="badge shrink-0 bg-secondary-container text-on-secondary-container">{% trans "Completed" %}</span>
{% elif status == "failed" %}
  <span class="badge shrink-0 bg-error-container text-on-error-container">{% trans "Failed" %}</span>
{% elif status == "processing" %}
  <span class="badge shrink-0 bg-tertiary-container text-on-tertiary-container">{% trans "Analyzing…" %}</span>
{% else %}
  <span class="badge shrink-0 bg-surface-container-high text-on-surface-variant">{% trans "Pending" %}</span>
{% endif %}
