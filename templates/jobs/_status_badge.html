{% load i18n %}
{% if status == "completed" %}
  <span class="badge-positive">{% trans "Completed" %}</span>
{% elif status == "failed" %}
  <span class="badge-negative">{% trans "Failed" %}</span>
{% elif status == "processing" %}
  <span class="badge-informative">{% trans "Analyzing…" %}</span>
{% else %}
  <span class="badge-neutral">{% trans "Pending" %}</span>
{% endif %}
