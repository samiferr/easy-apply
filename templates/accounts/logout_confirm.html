{% extends "accounts/auth_base.html" %}
{% load i18n %}
{% block title %}Log out · {{ SITE_NAME }}{% endblock %}
{% block auth_content %}
  <h1 class="auth__title">Log out of {{ SITE_NAME }}?</h1>
  <p class="auth__lead">{% trans "You can always log back in with your email and password." %}</p>

  <form method="post" action="{% url 'accounts:logout' %}" class="form__actions">
    {% csrf_token %}
    <a href="{% url 'core:dashboard' %}" class="btn btn--secondary btn--large">{% trans "Cancel" %}</a>
    <button type="submit" class="btn btn--primary btn--large">{% trans "Log out" %}</button>
  </form>
{% endblock %}
